name: Electron cache
# PR 上存的缓存只有该 PR 自己能读；在 main 上预热，所有 PR 和 release（tag）都能读到
on:
  push:
    branches: [main]
    paths: [pnpm-lock.yaml, .github/workflows/electron-cache.yml]
  workflow_dispatch:

jobs:
  warm:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Electron 二进制在首次运行时才从 GitHub release 下载（常 504），缓存 @electron/get 的默认缓存目录
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('node_modules/electron/package.json') }}
      # 命中缓存时只解压不联网；未命中时下载，失败重试，DEBUG 日志里能看出走的哪条路
      - run: for i in 1 2 3; do node node_modules/electron/install.js && exit 0; sleep 30; done; exit 1
        shell: bash
        env:
          DEBUG: '@electron/get*'
