<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PROTOTYPE · Synote 编辑器（#6）</title>
<style>
  html, body { margin: 0; height: 100%; background: #21252b; color: #abb2bf; font: 13px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: 36px 1fr; height: 100%; }
  aside { grid-row: 1 / 3; border-right: 1px solid #181a1f; display: flex; flex-direction: column; min-height: 0; }
  aside h4 { margin: 10px 10px 4px; color: #e5c07b; font-size: 12px; }
  #tree { flex: 1; overflow: auto; padding: 0 10px; white-space: nowrap; font-size: 12px; }
  #tree div { cursor: pointer; padding: 1px 0; } #tree div:hover { color: #fff; }
  #stats, #check { margin: 0 10px 8px; padding-left: 18px; font-size: 12px; }
  header { display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid #181a1f; }
  header button { background: #2c313a; color: inherit; border: 1px solid #3e4451; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  header button.on { background: #3e4451; color: #fff; }
  #path { margin-left: auto; opacity: .7; }
  #pane { min-height: 0; overflow: hidden; }
  #switcher { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
    background: #fff; color: #000; padding: 6px 14px; border-radius: 999px; box-shadow: 0 4px 16px #0008; font-weight: 600; z-index: 100; }
  #switcher button { border: 0; background: none; font-size: 16px; cursor: pointer; }
  .mermaid-modal { position: fixed; inset: 0; background: #000a; display: grid; place-items: center; z-index: 200; }
  .mm-win { width: min(1100px, 92vw); height: min(640px, 85vh); background: #282c34; border: 1px solid #3e4451; border-radius: 8px; display: flex; flex-direction: column; box-shadow: 0 10px 40px #000c; }
  .mm-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #181a1f; font-weight: 600; }
  .mm-hint { margin-left: auto; font-weight: 400; opacity: .6; font-size: 12px; }
  .mm-bar button { background: #2c313a; color: inherit; border: 1px solid #3e4451; border-radius: 4px; padding: 3px 12px; cursor: pointer; }
  .mm-bar button.on { background: #4d78cc; color: #fff; }
  .mm-body { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .mm-code { min-height: 0; border-right: 1px solid #181a1f; }
  .mm-preview { overflow: auto; padding: 16px; display: grid; place-items: center; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h4>外壳：<span id="shell"></span></h4>
    <div id="root" style="margin: 0 10px; font-size: 11px; opacity: .7"></div>
    <h4>性能</h4><ul id="stats"></ul>
    <h4>手测清单</h4>
    <ol id="check">
      <li>编辑模式：标题/粗体/链接源码只在光标处出现</li>
      <li>点击 mermaid 图 → 弹出独立编辑窗口（左源码右预览），⌘S 保存 / Esc 取消</li>
      <li>系统拼音、微信输入法：在编辑模式和 diff 右侧各输入一段中文（含候选框位置、回车上屏、退格）</li>
      <li>⌘/Ctrl+Shift+D 切 diff；对比 A/B 的对齐、字符高亮、还原按钮、折叠未改区</li>
      <li>两种 diff 的快捷键（⌘D 多光标、⌥↑ 移动行、⌘F 查找）是否一致</li>
    </ol>
    <h4>文件</h4>
    <div id="tree"></div>
  </aside>
  <header>
    <button id="mode-edit">编辑（实时预览）</button>
    <button id="mode-diff">Diff（HEAD ↔ 工作区）</button>
    <button id="reset" title="把工作区内容重置">重置</button>
    <span id="path"></span>
  </header>
  <div id="pane"></div>
</div>
<div id="switcher"><button id="prev">←</button><span id="variant-label"></span><button id="next">→</button></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
